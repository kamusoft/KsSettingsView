# KsSettingsView Sample (Android) — Gradle プロパティ

# JVM 引数（Gradle デーモン）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Gradle 並列ビルド
org.gradle.parallel=true

# IDE（Gradle Tooling API）の sync を並列実行する。
# 本 Sample は composite build で本体 build を取り込むため、モデル取得の並列化が効く。
org.gradle.tooling.parallel=true

# AndroidX を使用
android.useAndroidX=true

# Kotlin コードスタイル
kotlin.code.style=official
