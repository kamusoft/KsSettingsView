# iOS 消費者検証 (再利用可能 workflow)
#
# 配布物を利用者と同じ経路 (SwiftPM の product 参照) で解決し、利用者向けドキュメントの
# iOS 最小例を含む消費者パッケージを iOS Simulator 向け Release でビルドする。
# 本体のテストは verify-ios.yml の担当で、この workflow は配布物の解決可否だけを見る。
#
# 参照先は mode で決まる。dry-run はモノレポから作ったスナップショットへの path 参照、
# smoke は配信リポジトリの tag。artifact 入力は dry-run 専用で、与えるとその成果物を参照先にして
# フィード準備 (スナップショットの生成) を行わない。smoke の参照先は公開レジストリで、
# 準備済みの配布物を差し込む余地がないため、smoke との同時指定は入力検査で拒む。
#
# 配信先への書き込み経路を持たないことを構成で示すため、権限は contents: read だけとし、
# secrets は受け取らない。
name: verify consumer ios

on:
  workflow_call:
    inputs:
      mode:
        description: "参照先の選択 (dry-run | smoke)"
        type: string
        required: true
      version:
        description: "解決する version (smoke では必須。dry-run で空なら開発用既定値)"
        type: string
        required: false
        default: ""
      artifact:
        description: "外部で準備した配布物の artifact 名 (dry-run 専用。空ならフィード準備を job 内で行う)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # Xcode はメジャー.マイナーで固定し、パッチはランナーイメージ同梱の版に任せる。
  # 版を上げるときはこの値を変える PR として意図的に行う。
  KS_XCODE_VERSION: "26.5"

jobs:
  verify:
    name: verify
    runs-on: macos-26
    # 既定の 360 分は長すぎる。スナップショット生成と Simulator 向けビルドに対する
    # 上限として置き、ハングで高コストな macOS ランナーを占有し続けないようにする。
    timeout-minutes: 30

    steps:
      # 入力の検査はフィード準備より前に行う。checkout より前に置くことで、
      # 不正な入力が配布物の準備どころかソースの取得にも到達しない。
      - name: Validate inputs
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_VERSION: ${{ inputs.version }}
          KS_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          case "${KS_MODE}" in
            dry-run|smoke) ;;
            *)
              echo "::error::mode は dry-run か smoke のいずれかです: ${KS_MODE}"
              exit 1
              ;;
          esac
          if [ "${KS_MODE}" = "smoke" ] && [ -z "${KS_VERSION}" ]; then
            echo "::error::smoke では version が必須です"
            exit 1
          fi
          # download-artifact より前に落とす。smoke の参照先は公開レジストリで、
          # 渡された成果物は使われない — 黙って無視すると「渡した配布物を検証した」と
          # 誤解される。
          if [ "${KS_MODE}" = "smoke" ] && [ -n "${KS_ARTIFACT}" ]; then
            echo "::error::smoke では artifact を指定できません (参照先は公開レジストリで、準備済みの配布物は使いません)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          # メジャー.マイナーが一致する Xcode のうち、パッチが最も新しいものを選ぶ。
          app=$(ls -d "/Applications/Xcode_${KS_XCODE_VERSION}"*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$app" ]; then
            echo "::error::Xcode ${KS_XCODE_VERSION} がランナーイメージに存在しない"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=${app}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          swift --version

      # package identity は参照先のディレクトリ名から決まるため、展開先の末尾は
      # 配信リポジトリと同じ `KsSettingsView-SPM` でなければならない。
      - name: Download prepared distribution
        if: inputs.artifact != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/reference/KsSettingsView-SPM

      - name: Verify consumer
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_VERSION: ${{ inputs.version }}
          KS_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          args=(--mode "${KS_MODE}" --work "${RUNNER_TEMP}/consumer")
          if [ -n "${KS_VERSION}" ]; then
            args+=(--version "${KS_VERSION}")
          fi
          if [ -n "${KS_ARTIFACT}" ]; then
            args+=(--reference "${RUNNER_TEMP}/reference/KsSettingsView-SPM")
          fi
          verification/ios/build-consumer.sh "${args[@]}"
