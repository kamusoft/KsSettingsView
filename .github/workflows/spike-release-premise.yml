# リリース workflow の前提の実測 (一時的な workflow)
#
# 実測後に削除する。リリースの運用には関与しない。
#
# 確かめるのは 2 つ。
#
#   1. Android の発行物の再現性
#      別々の checkout で同じ commit・同じ JDK・同じランナー OS から発行した結果が、
#      比較スクリプトで同一と判定されること。publish が署名鍵つきで作り直した発行物を
#      消費者検証に渡したものと突き合わせる前提になる。
#   2. 実行をまたぐ artifact の引き継ぎ
#      「失敗した job から再実行」したとき、成功済みの job は再実行されず、前の attempt が
#      upload した artifact を後続の job が download できること。保留中の deployment の ID を
#      再実行へ引き継ぐ前提になる。
#
# 2 の確認手順: 1 回目の実行では reuse job が意図的に失敗する。失敗した job だけを
# 再実行し、seed が再実行されないまま reuse が artifact を取得して成功すれば前提が成り立つ。
name: spike release premise

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KS_SPIKE_VERSION: 0.0.0-spike.1

jobs:
  build-a:
    name: build-a
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Publish to local Maven repository
        working-directory: android
        run: ./gradlew --no-daemon --console=plain publishToMavenLocal -Pversion="${KS_SPIKE_VERSION}"

      - name: Stage local Maven repository
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/maven"
          cp -R "${HOME}/.m2/repository/jp" "${RUNNER_TEMP}/maven/jp"

      - name: Upload local Maven repository
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spike-maven-a
          path: ${{ runner.temp }}/maven
          if-no-files-found: error
          retention-days: 1

  build-b:
    name: build-b
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Publish to local Maven repository
        working-directory: android
        run: ./gradlew --no-daemon --console=plain publishToMavenLocal -Pversion="${KS_SPIKE_VERSION}"

      - name: Stage local Maven repository
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/maven"
          cp -R "${HOME}/.m2/repository/jp" "${RUNNER_TEMP}/maven/jp"

      - name: Upload local Maven repository
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spike-maven-b
          path: ${{ runner.temp }}/maven
          if-no-files-found: error
          retention-days: 1

  compare:
    name: compare
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build-a
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: spike-maven-a
          path: ${{ runner.temp }}/a

      - name: Download build-b
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: spike-maven-b
          path: ${{ runner.temp }}/b

      - name: Compare artifacts
        run: scripts/release/compare-maven-artifacts.sh "${RUNNER_TEMP}/a/jp" "${RUNNER_TEMP}/b/jp"

  seed:
    name: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Write deployment id
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/deployment"
          printf '%s' "00000000-0000-0000-0000-000000000000" \
            > "${RUNNER_TEMP}/deployment/deployment-id.txt"

      - name: Upload deployment id
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: central-deployment-id
          path: ${{ runner.temp }}/deployment/deployment-id.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  reuse:
    name: reuse
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download deployment id
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: central-deployment-id
          path: ${{ runner.temp }}/deployment

      - name: Check deployment id
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/deployment/deployment-id.txt"
          echo "attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "内容: $(cat "${file}")"
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then
            echo "::error::1 回目は意図的に失敗する (失敗した job だけを再実行して、この job が前の attempt の artifact を取得できることを確かめる)"
            exit 1
          fi
          echo "前の attempt が upload した artifact を取得できた"
