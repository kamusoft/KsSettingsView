<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TimePicker 配色モック A — 背景 = Theme.backgroundColor</title>
<style>
  :root {
    /* SampleTheme.maui のトークン解決値 (モック上の仮当て。実装は Theme から解決する) */
    --dialog-bg: #F2EFE6;          /* Theme.backgroundColor */
    --accent: #FFBF00;             /* cellAccentColor 解決値 */
    --accent-tint: rgba(255, 191, 0, 0.16);
    --on-accent: #1A1A1A;          /* accent 輝度が高い → 黒系 */
    --text: #CC9900;               /* cellTitleColor 解決値 */
    --surface-derived: rgba(0, 0, 0, 0.055); /* 背景から導出する中間面 */
    --page-bg: #D9D4C6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page-bg);
    font-family: "Roboto", "Noto Sans JP", sans-serif;
    display: flex; gap: 48px; justify-content: center; align-items: flex-start;
    padding: 40px; min-height: 100vh;
  }
  .variant-label {
    position: fixed; top: 8px; left: 12px; font-size: 13px; color: #555;
    background: rgba(255,255,255,0.8); padding: 4px 10px; border-radius: 6px;
  }
  .column { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .caption { font-size: 13px; color: #444; }

  .dialog {
    background: var(--dialog-bg);
    border-radius: 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    padding: 24px;
    width: 336px;
  }
  .header { font-size: 12px; letter-spacing: 0.5px; color: var(--text); margin: 0 0 20px 4px; }

  /* ===== 時刻表示 (チップ / 入力フィールド) ===== */
  .time-row { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .time-field {
    width: 114px; height: 80px; border-radius: 10px;
    background: var(--surface-derived);
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; color: var(--text); position: relative;
  }
  .time-field.selected {
    background: var(--accent-tint);
    outline: 2px solid var(--accent); outline-offset: -2px;
  }
  .colon { font-size: 44px; color: var(--text); padding: 0 6px; }
  .field-label { font-size: 12px; color: var(--text); margin-top: 6px; }
  .labels { display: flex; justify-content: center; gap: 92px; }
  .caret {
    display: inline-block; width: 2px; height: 48px; background: var(--accent);
    margin-left: 3px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== 時計文字盤 ===== */
  .clock {
    width: 256px; height: 256px; border-radius: 50%;
    background: var(--surface-derived);
    position: relative; margin: 24px auto 8px;
  }
  .clock .num {
    position: absolute; width: 32px; height: 32px; line-height: 32px;
    text-align: center; font-size: 15px; color: var(--text);
    transform: translate(-50%, -50%);
  }
  .clock .num.inner { font-size: 13px; opacity: 0.85; }
  .hand { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; height: 2px; background: var(--accent); }
  .center-dot { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: translate(-50%,-50%); }
  .knob {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    transform: translate(-50%,-50%);
  }

  /* ===== フッタ ===== */
  .footer { display: flex; align-items: center; margin-top: 20px; }
  .mode-btn { width: 40px; height: 40px; border: none; background: transparent; cursor: default; color: var(--text); display: flex; align-items: center; justify-content: center; }
  .mode-btn svg { fill: var(--text); }
  .spacer { flex: 1; }
  .btn {
    border: none; background: transparent; color: var(--accent);
    font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 20px; cursor: default;
  }
</style>
</head>
<body>
  <div class="variant-label">A案: ダイアログ背景 = Theme.backgroundColor (#F2EFE6)</div>

  <!-- キーボード入力モード -->
  <div class="column">
    <div class="dialog">
      <p class="header">アラーム時刻</p>
      <div class="time-row">
        <div class="time-field selected">07<span class="caret"></span></div>
        <div class="colon">:</div>
        <div class="time-field">30</div>
      </div>
      <div class="labels">
        <span class="field-label">時間</span><span class="field-label">分</span>
      </div>
      <div class="footer">
        <button class="mode-btn" aria-label="時計モードへ">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.2 3.1.8-1.3-4.5-2.7V7z"/></svg>
        </button>
        <div class="spacer"></div>
        <button class="btn">キャンセル</button>
        <button class="btn">OK</button>
      </div>
    </div>
    <div class="caption">キーボード入力モード (時フィールド選択中)</div>
  </div>

  <!-- 時計文字盤モード -->
  <div class="column">
    <div class="dialog">
      <p class="header">アラーム時刻</p>
      <div class="time-row">
        <div class="time-field selected" style="width:96px;height:72px;font-size:42px;">07</div>
        <div class="colon">:</div>
        <div class="time-field" style="width:96px;height:72px;font-size:42px;">30</div>
      </div>
      <div class="clock" id="clock"></div>
      <div class="footer">
        <button class="mode-btn" aria-label="キーボードモードへ">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 12H4V7h16v10zM6 9h2v2H6V9zm0 3h2v2H6v-2zm3-3h2v2H9V9zm0 3h2v2H9v-2zm3-3h2v2h-2V9zm0 3h2v2h-2v-2zm3-3h2v2h-2V9zm0 3h2v2h-2v-2zM8 15h8v2H8v-2z"/></svg>
        </button>
        <div class="spacer"></div>
        <button class="btn">キャンセル</button>
        <button class="btn">OK</button>
      </div>
    </div>
    <div class="caption">時計文字盤モード (7 時選択中・24h 二重リング)</div>
  </div>

<script>
  // 24h 二重リングの文字盤を生成する (選択値 = 7)
  const clock = document.getElementById("clock");
  const C = 128, R_OUT = 104, R_IN = 68, SELECTED = 7;
  function place(value, ring) {
    const idx = value % 12;
    const angle = (idx * 30 - 90) * Math.PI / 180;
    const r = ring === "outer" ? R_OUT : R_IN;
    const x = C + r * Math.cos(angle), y = C + r * Math.sin(angle);
    if (value === SELECTED) {
      const knob = document.createElement("div");
      knob.className = "knob"; knob.textContent = String(value);
      knob.style.left = x + "px"; knob.style.top = y + "px";
      // 針: 中心からノブ縁まで
      const len = Math.hypot(x - C, y - C) - 22;
      const hand = document.createElement("div");
      hand.className = "hand";
      hand.style.width = len + "px";
      hand.style.transform = "rotate(" + Math.atan2(y - C, x - C) + "rad)";
      clock.appendChild(hand); clock.appendChild(knob);
      return;
    }
    const el = document.createElement("div");
    el.className = "num" + (ring === "inner" ? " inner" : "");
    el.textContent = value === 0 ? "00" : String(value);
    el.style.left = x + "px"; el.style.top = y + "px";
    clock.appendChild(el);
  }
  for (let v = 0; v < 12; v++) place(v, "outer");
  for (let v = 12; v < 24; v++) place(v, "inner");
  const dot = document.createElement("div");
  dot.className = "center-dot"; clock.appendChild(dot);
</script>
</body>
</html>
